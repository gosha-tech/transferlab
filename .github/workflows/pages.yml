name: Build and publish TransferLab

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - scripts/**
      - assets/**
      - TransferLab_RESTORED_2026-11-16.zip
      - data/**
  schedule:
    - cron: '17 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: transferlab-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A scheduled import may have committed a fresher data snapshot while
          # this build was queued. Always build the latest main, not stale event SHA.
          ref: main
      - name: Validate API-Football data parser
        run: |
          python scripts/sync_api.py --self-test
          python scripts/sync_free.py --self-test
          python scripts/player_competitions.py
          python scripts/sync_pl.py --self-test
          python scripts/commons_photos.py --self-test
          python scripts/sync_pitchapi.py --self-test
          python scripts/sync_lineups.py --self-test
          python scripts/roster_freshness.py
          python scripts/verify_current_sync.py --self-test
          python scripts/enrich_profiles.py --self-test
          python scripts/import_historical_appearances.py --self-test
          python scripts/import_historical_starts.py --self-test
          python scripts/import_market_history.py --self-test
          python -m py_compile scripts/sync_api.py scripts/sync_free.py scripts/sync_pl.py scripts/commons_photos.py scripts/sync_pitchapi.py scripts/sync_lineups.py scripts/roster_freshness.py scripts/player_competitions.py scripts/tournaments_build.py scripts/enrich_profiles.py scripts/import_historical_appearances.py scripts/import_historical_starts.py scripts/import_market_history.py scripts/audit_coverage.py scripts/verify_current_sync.py
      - name: Refresh all configured competitions (daily or manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # For a paid API-Football plan with current-season access; adjust in Actions vars.
          # Free API-Football does NOT provide 2026/27 historical stats.
          API_REQUEST_BUDGET: ${{ vars.API_REQUEST_BUDGET || '1400' }}
          API_MAX_PAGES: ${{ vars.API_MAX_PAGES || '100' }}
          API_REQUEST_INTERVAL_SECONDS: ${{ vars.API_REQUEST_INTERVAL_SECONDS || '0.6' }}
        run: |
          python scripts/sync_api.py
      - name: Fetch free up-to-date matches and available player profiles
        # Only daily / manual to avoid consuming free API rate limits during code releases.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refresh-free]')
        # Does not require API-Football key. On upstream outages keep last saved data.
        continue-on-error: true
        env:
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          SPORTSDB_BATCH: '48'
        run: python scripts/sync_free.py
      - name: Refresh current EPL stats from free licensed CSV
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refresh-current]')
        run: python scripts/sync_pl.py
      - name: Find licensed Wikimedia Commons portraits by verified player identity
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refresh-photos]')
        env:
          WIKIMEDIA_BATCH: '40'
        run: python scripts/commons_photos.py
      # Import all supported leagues, persist snapshots before HTML tests and
      # continue incomplete seasons during the next scheduled daily run.
      - name: Refresh PitchAPI player match analytics for 2024/25–2026/27
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refresh-pitch]')
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
          PITCHAPI_REQUEST_BUDGET: ${{ vars.PITCHAPI_REQUEST_BUDGET || '1600' }}
          PITCHAPI_DETAIL_BUDGET: ${{ vars.PITCHAPI_DETAIL_BUDGET || '150' }}
          PITCHAPI_PAUSE: '0.18'
          PITCHAPI_REQUIRED: '1'
        run: python scripts/sync_pitchapi.py
      - name: Add confirmed starting XI counts, including past seasons
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refresh-lineups]') || contains(github.event.head_commit.message, '[refresh-pitch]')
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
          PITCHAPI_REQUIRED: '1'
          # First full season starts backfill; subsequent runs skip verified lineups.
          PITCHAPI_LINEUP_BUDGET: ${{ vars.PITCHAPI_LINEUP_BUDGET || '1100' }}
          PITCHAPI_PAUSE: '0.18'
        run: python scripts/sync_lineups.py
      - name: Confirm fresh current-season player data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refresh-pitch]')
        run: python scripts/verify_current_sync.py
      - name: Import observed five-year player market values (archived, non-live)
        run: python scripts/import_market_history.py --download
      - name: Backfill archival player starts by tournament
        continue-on-error: true
        run: python scripts/import_historical_starts.py --download
      - name: Persist refreshed source data in GitHub
        # Persist provider snapshots BEFORE the site build/browser tests.
        # A UI regression must never discard 20 minutes of verified API data.
        # Generated HTML is not committed, so source and presentation stay separate.
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live.json data/free_sources.json
          if [ -f data/pl_current.json ]; then git add data/pl_current.json; fi
          if [ -f data/commons_photos.json ]; then git add data/commons_photos.json; fi
          if [ -f data/pitchapi.json ]; then git add data/pitchapi.json; fi
          if [ -f data/profile_enrichment.json ]; then git add data/profile_enrichment.json; fi
          if [ -f data/historical_stats.json ]; then git add data/historical_stats.json; fi
          if [ -f data/historical_starts.json ]; then git add data/historical_starts.json; fi
          if [ -f data/market_history.json ]; then git add data/market_history.json; fi
          if [ -f data/verified_roster.json ]; then git add data/verified_roster.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Cache verified football source snapshots [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                # Rebase "theirs" means this job's newly checked snapshot.
                # Resolve only machine-generated JSON cache conflicts, never code.
                for p in $(git diff --name-only --diff-filter=U); do
                  case "$p" in
                    data/live.json|data/free_sources.json|data/pl_current.json|data/commons_photos.json|data/pitchapi.json|data/profile_enrichment.json|data/historical_stats.json|data/historical_starts.json|data/market_history.json)
                      git checkout --theirs -- "$p"
                      git add "$p"
                      ;;
                    *)
                      echo "Unexpected conflict in source code: $p"
                      git rebase --abort
                      exit 1
                      ;;
                  esac
                done
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
              fi
              if git push origin HEAD:main; then
                echo "Updated player and match snapshots persisted"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "Failed to persist source data after retries"
                exit 1
              fi
              sleep 4
            done
          fi
      - name: Build TransferLab from uploaded ZIP
        run: |
          python scripts/prepare.py
          python scripts/enrich_profiles.py --download
          python scripts/import_historical_appearances.py --download
          python scripts/import_historical_starts.py --download || echo 'Historical XI archive unavailable; retaining published statistics'
          python scripts/import_market_history.py --download
          python scripts/tournaments_build.py _site/index.html
          mkdir -p _site/assets _site/data
          cp assets/site.css assets/site.js _site/assets/
          cp data/live.json data/free_sources.json _site/data/
          if [ -f data/pl_current.json ]; then cp data/pl_current.json _site/data/; fi
          if [ -f data/commons_photos.json ]; then cp data/commons_photos.json _site/data/; fi
          if [ -f data/pitchapi.json ]; then cp data/pitchapi.json _site/data/; fi
      - name: Audit every league and three-season data coverage
        run: python scripts/audit_coverage.py
      - name: Validate player registry and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          html=Path('_site/index.html').read_text(encoding='utf-8')
          data=re.search(r'<script id="embeddedData" type="application/json">(.*?)</script>', html, re.S)
          assert data, 'No database'
          root=json.loads(data.group(1))
          ids=[str(p['id']) for p in root['players']]
          assert len(ids)>=1300 and len(ids)==len(set(ids))
          assert 'sortBy' in html and 'assets/site.css' in html
          assert 'competitionSelect' in html and 'liveTournamentStats' in root
          assert 'liveCompetitionCatalog' in root
          assert 'freeMatchResults' in root
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          Path('/tmp/transferlab.js').write_text(scripts[-1],encoding='utf-8')
          print('Verified:',len(ids),'unique players')
          PY
          node --check /tmp/transferlab.js
          node --check _site/assets/site.js
      - name: Validate generated provider-backed site
        run: python scripts/test_tournaments.py
      - name: Browser smoke test
        run: |
          python -m pip install --quiet playwright==1.56.0
          python scripts/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transferlab-screenshots
          path: smoke_screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
