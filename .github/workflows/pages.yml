name: Publish TransferLab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - data/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: transferlab-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify website exists
        run: test -s index.html
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d assets ]; then cp -R assets _site/assets; fi
          if [ -d data ]; then cp -R data _site/data; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
