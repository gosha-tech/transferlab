name: Build and publish TransferLab

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - scripts/**
      - assets/**
      - TransferLab_RESTORED_2026-11-16.zip
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: transferlab-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build TransferLab from uploaded ZIP
        run: |
          python scripts/prepare.py
          mkdir -p _site/assets
          cp assets/site.css assets/site.js _site/assets/
      - name: Validate player registry and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          html=Path('_site/index.html').read_text(encoding='utf-8')
          data=re.search(r'<script id="embeddedData" type="application/json">(.*?)</script>', html, re.S)
          assert data, 'No database'
          root=json.loads(data.group(1))
          ids=[str(p['id']) for p in root['players']]
          assert len(ids)>=1300 and len(ids)==len(set(ids))
          assert 'sortBy' in html and 'assets/site.css' in html
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          Path('/tmp/transferlab.js').write_text(scripts[-1],encoding='utf-8')
          print('Verified:',len(ids),'unique players')
          PY
          node --check /tmp/transferlab.js
          node --check _site/assets/site.js
      - name: Browser smoke test
        run: |
          python -m pip install --quiet playwright==1.56.0
          python scripts/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transferlab-screenshots
          path: smoke_screenshots/
          if-no-files-found: ignore
      - name: Save generated index.html in repository
        continue-on-error: true
        run: |
          cp _site/index.html index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Build TransferLab 5.0 from source archive [skip ci]"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
